<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rutina Gym</title>
<style>
:root { --bg:#fff; --card:#f8f9fa; --bordo:#800020; --blue:#1e40af; --text:#1f2937; --muted:#6b7280; --ok:#166534; --border:#e5e7eb; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
.container { max-width:480px; margin:0 auto; padding:16px; }
h1 { font-size:1.5rem; margin:0 0 4px; color:var(--bordo); }
h2 { font-size:1.15rem; margin:0 0 12px; color:var(--blue); }
.subtitle { color:var(--muted); margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
button { width:100%; padding:13px; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:8px; }
.btn-primary { background:var(--bordo); color:white; }
.btn-secondary { background:#e5e7eb; color:var(--text); }
.btn-ok { background:var(--ok); color:white; }
.btn-blue { background:var(--blue); color:white; }
.timer { font-size:3.2rem; font-weight:700; text-align:center; margin:8px 0; color:var(--bordo); }
.timer.rest { color:var(--blue); }
.exercise-name { font-size:1.25rem; font-weight:700; color:var(--bordo); }
.meta { color:var(--muted); font-size:0.95rem; margin:4px 0 10px; }
.row { display:flex; gap:8px; }
.row button { flex:1; }
input, select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); font-size:1rem; margin-top:4px; }
.progress { height:5px; background:#e5e7eb; border-radius:3px; margin:8px 0 14px; }
.progress > div { height:100%; background:var(--bordo); border-radius:3px; }
.rating { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
.rating button { flex:1; min-width:70px; padding:8px 4px; font-size:0.8rem; }
.hidden { display:none !important; }
.ex-list { list-style:none; padding:0; margin:0; }
.ex-list li { padding:10px 0; border-bottom:1px solid var(--border); }
.warmup { color:var(--blue); font-weight:600; }
small { color:var(--muted); }
label { display:block; margin-top:10px; font-size:0.9rem; }
</style>
</head>
<body>
<div class="container">
  <div id="home">
    <h1>Rutina de hoy</h1>
    <p class="subtitle">Día 1 · Tren superior + zona media</p>
    <div class="card">
      <h2>Vista previa</h2>
      <ul class="ex-list" id="previewList"></ul>
    </div>
    <button class="btn-primary" onclick="startSession()">Empezar sesión</button>
  </div>

  <div id="workout" class="hidden">
    <div class="progress"><div id="progressBar" style="width:0%"></div></div>
    <div class="card">
      <div class="exercise-name" id="exName">—</div>
      <div class="meta" id="exMeta">—</div>
      <div id="choiceArea"></div>
      <div class="timer" id="timer">00:00</div>
      <div class="row">
        <button class="btn-secondary" id="btnPause" onclick="toggleTimer()">Pausar</button>
        <button class="btn-primary" id="btnFinish" onclick="finishSet()">Terminé la serie</button>
      </div>
      <button class="btn-blue hidden" id="btnNext" onclick="goNext()">Siguiente</button>
    </div>
    <div class="card" id="inputsCard">
      <div id="weightArea"></div>
      <div id="repsArea"></div>
      <div style="margin-top:12px">
        <small>Dificultad de esta serie</small>
        <div class="rating" id="ratingBtns"></div>
      </div>
    </div>
    <button class="btn-secondary" onclick="skipExercise()">Saltar este ejercicio</button>
  </div>

  <div id="summary" class="hidden">
    <h2>Sesión terminada</h2>
    <div class="card" id="summaryContent"></div>
    <button class="btn-primary" onclick="location.reload()">Volver</button>
  </div>
</div>

<script>
const ROUTINE = {
  name: "Día 1 · Tren superior + zona media",
  exercises: [
    { name: "Calentamiento: círculos de brazo + flexiones de pared + gato-camello", sets: 1, reps: "8", rest: 20, weight: 0, timed: false, isWarmup: true },
    { name: "Remo", options: ["Remo sentado (máquina)", "Remo con mancuerna"], sets: 3, reps: "8-10", rest: 90, weight: 20, unilateral: true, timed: false },
    { name: "Press de pecho", options: ["Press mancuernas", "Press máquina"], sets: 3, reps: "8-10", rest: 90, weight: 30, timed: false },
    { name: "Jalón al pecho", sets: 3, reps: "8-10", rest: 75, weight: 35, timed: false },
    { name: "Press de hombro", sets: 3, reps: "8", rest: 75, weight: 15, unilateral: true, timed: false },
    { name: "Face pull", sets: 2, reps: "12", rest: 60, weight: 15, timed: false },
    { name: "Curl-up McGill", sets: 2, reps: "8 por lado", rest: 45, weight: 0, timed: false },
    { name: "Dead bug", sets: 3, reps: "6 por lado", rest: 45, weight: 0, timed: false },
    { name: "Plancha", sets: 2, reps: "30", rest: 45, weight: 0, timed: true },
    { name: "Bird dog", sets: 2, reps: "8 por lado", rest: 40, weight: 0, timed: false },
    { name: "Pallof press", sets: 2, reps: "10 por lado", rest: 45, weight: 10, timed: false }
  ]
};

let state = { currentEx: 0, currentSet: 1, timer: null, seconds: 0, isPaused: false, selectedRating: 3, logs: [], chosenOption: null };

const ratings = [
  { label: "Muy fácil", value: 1 },
  { label: "Fácil", value: 2 },
  { label: "Justo", value: 3 },
  { label: "Difícil", value: 4 },
  { label: "Imposible", value: 5 }
];

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.25;
    o.start(); o.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function initPreview() {
  const list = document.getElementById("previewList");
  list.innerHTML = "";
  ROUTINE.exercises.forEach(ex => {
    const li = document.createElement("li");
    const label = ex.options ? ex.options.join(" / ") : ex.name;
    li.innerHTML = (ex.isWarmup ? '<span class="warmup">● </span>' : '') + label +
      `<br><small>${ex.sets} × ${ex.reps}${ex.timed ? " s" : ""}${ex.weight ? " · " + ex.weight + " kg" : ""}</small>`;
    list.appendChild(li);
  });
}

function startSession() {
  state.currentEx = 0; state.currentSet = 1; state.logs = []; state.chosenOption = null;
  document.getElementById("home").classList.add("hidden");
  document.getElementById("workout").classList.remove("hidden");
  renderExercise();
}

function renderExercise() {
  const ex = ROUTINE.exercises[state.currentEx];
  if (!ex) { endSession(); return; }

  const displayName = state.chosenOption || (ex.options ? ex.options[0] : ex.name);
  document.getElementById("exName").textContent = displayName;
  document.getElementById("exMeta").textContent = `Serie ${state.currentSet} de ${ex.sets} · objetivo ${ex.reps}${ex.timed ? " s" : ""}`;

  // Choice
  const choice = document.getElementById("choiceArea");
  choice.innerHTML = "";
  if (ex.options && state.currentSet === 1) {
    const sel = document.createElement("select");
    sel.innerHTML = ex.options.map(o => `<option>${o}</option>`).join("");
    sel.onchange = () => { state.chosenOption = sel.value; document.getElementById("exName").textContent = sel.value; };
    choice.appendChild(sel);
    state.chosenOption = sel.value;
  }

  // Fields
  const wArea = document.getElementById("weightArea");
  const rArea = document.getElementById("repsArea");
  wArea.innerHTML = ""; rArea.innerHTML = "";

  if (ex.timed) {
    rArea.innerHTML = `<label>Tiempo (segundos)</label><input type="number" id="inputReps" value="${ex.reps}">`;
  } else if (ex.weight > 0) {
    const label = ex.unilateral ? "Peso por brazo (kg)" : "Peso (kg)";
    wArea.innerHTML = `<label>${label} <small>— tocá solo si cambia</small></label><input type="number" id="inputWeight" step="0.5" value="${ex.weight}">`;
    rArea.innerHTML = `<label>Repeticiones hechas</label><input type="number" id="inputReps" value="${ex.reps.split("-")[0].replace("/lado","")}">`;
  } else {
    rArea.innerHTML = `<label>Repeticiones hechas</label><input type="number" id="inputReps" value="${ex.reps.split("-")[0].replace("/lado","")}">`;
  }

  // Ratings
  const ratingDiv = document.getElementById("ratingBtns");
  ratingDiv.innerHTML = "";
  ratings.forEach(r => {
    const b = document.createElement("button");
    b.className = "btn-secondary";
    b.textContent = r.label;
    b.onclick = () => selectRating(r.value, b);
    ratingDiv.appendChild(b);
  });
  state.selectedRating = 3;

  document.getElementById("progressBar").style.width = ((state.currentEx / ROUTINE.exercises.length) * 100) + "%";

  clearInterval(state.timer);
  if (ex.timed) {
    startTimedWork(parseInt(ex.reps) || 30);
  } else {
    document.getElementById("timer").className = "timer";
    document.getElementById("timer").textContent = "—";
    document.getElementById("btnPause").disabled = true;
    document.getElementById("btnPause").textContent = "—";
  }
}

function selectRating(val, btn) {
  state.selectedRating = val;
  document.querySelectorAll("#ratingBtns button").forEach(b => { b.classList.remove("btn-ok"); b.classList.add("btn-secondary"); });
  btn.classList.remove("btn-secondary"); btn.classList.add("btn-ok");
}

function startTimedWork(sec) {
  state.seconds = sec; state.isPaused = false;
  document.getElementById("timer").className = "timer";
  document.getElementById("btnPause").disabled = false;
  document.getElementById("btnPause").textContent = "Pausar";
  updateTimer();
  state.timer = setInterval(() => {
    if (!state.isPaused && state.seconds > 0) {
      state.seconds--; updateTimer();
      if (state.seconds === 0) { clearInterval(state.timer); playBeep(); }
    }
  }, 1000);
}

function startRest(sec) {
  state.seconds = sec; state.isPaused = false;
  document.getElementById("timer").className = "timer rest";
  document.getElementById("btnPause").disabled = false;
  document.getElementById("btnPause").textContent = "Pausar";
  document.getElementById("btnFinish").textContent = "Descansando...";
  document.getElementById("btnFinish").disabled = true;
  updateTimer();
  state.timer = setInterval(() => {
    if (!state.isPaused && state.seconds > 0) {
      state.seconds--;
      updateTimer();
      if (state.seconds === 0) {
        clearInterval(state.timer);
        playBeep();
        nextSetOrExercise();
      }
    }
  }, 1000);
}

function nextSetOrExercise() {
  const ex = ROUTINE.exercises[state.currentEx];
  if (!ex) { endSession(); return; }

  if (state.currentSet < ex.sets) {
    state.currentSet++;
  } else {
    state.currentEx++;
    state.currentSet = 1;
    state.chosenOption = null;
  }
  renderExercise();
}

function updateTimer() {
  const m = Math.floor(state.seconds / 60).toString().padStart(2,"0");
  const s = (state.seconds % 60).toString().padStart(2,"0");
  document.getElementById("timer").textContent = m + ":" + s;
}

function toggleTimer() {
  state.isPaused = !state.isPaused;
  document.getElementById("btnPause").textContent = state.isPaused ? "Reanudar" : "Pausar";
}

function finishSet() {
  const ex = ROUTINE.exercises[state.currentEx];
  const weightEl = document.getElementById("inputWeight");
  const repsEl = document.getElementById("inputReps");
  const weight = weightEl ? parseFloat(weightEl.value) || 0 : 0;
  const reps = repsEl ? repsEl.value : ex.reps;
  state.logs.push({ exercise: state.chosenOption || ex.name, set: state.currentSet, weight, reps, rating: state.selectedRating });

  if (state.selectedRating <= 2 && ex.weight > 0) ex.weight = Math.round((ex.weight * 1.05) * 2) / 2;
  if (state.selectedRating >= 4 && ex.weight > 0) ex.weight = Math.max(0, Math.round((ex.weight * 0.9) * 2) / 2);

  clearInterval(state.timer);
  document.getElementById("btnFinish").classList.add("hidden");
  document.getElementById("btnNext").classList.remove("hidden");
  document.getElementById("btnNext").textContent = "Siguiente";
  startRest(ex.rest);
}

function goNext() {
  clearInterval(state.timer);
  document.getElementById("btnNext").classList.add("hidden");
  document.getElementById("btnFinish").classList.remove("hidden");
  document.getElementById("btnFinish").textContent = "Terminé la serie";
  document.getElementById("btnFinish").disabled = false;
  nextSetOrExercise();
}

function startRest(sec) {
  state.seconds = sec; state.isPaused = false;
  document.getElementById("timer").className = "timer rest";
  document.getElementById("btnPause").disabled = false;
  document.getElementById("btnPause").textContent = "Pausar";
  updateTimer();
  state.timer = setInterval(() => {
    if (!state.isPaused && state.seconds > 0) {
      state.seconds--;
      updateTimer();
      if (state.seconds === 0) {
        clearInterval(state.timer);
        playBeep();
        // Auto-advance only if user hasn't clicked yet
        if (!document.getElementById("btnNext").classList.contains("hidden")) {
          goNext();
        }
      }
    }
  }, 1000);
}

function nextSetOrExercise() {
  const ex = ROUTINE.exercises[state.currentEx];
  if (state.currentSet < ex.sets) {
    state.currentSet++;
  } else {
    state.currentEx++;
    state.currentSet = 1;
    state.chosenOption = null;
  }
  renderExercise();
}

function skipExercise() {
  if (confirm("¿Saltar este ejercicio?")) {
    state.currentEx++; state.currentSet = 1; state.chosenOption = null;
    clearInterval(state.timer);
    renderExercise();
  }
}

function endSession() {
  clearInterval(state.timer);
  document.getElementById("workout").classList.add("hidden");
  document.getElementById("summary").classList.remove("hidden");

  // Group logs by exercise
  const grouped = {};
  state.logs.forEach(l => {
    if (!grouped[l.exercise]) grouped[l.exercise] = { sets: 0, reps: [], weights: [], ratings: [] };
    grouped[l.exercise].sets++;
    grouped[l.exercise].reps.push(l.reps);
    grouped[l.exercise].weights.push(l.weight);
    grouped[l.exercise].ratings.push(l.rating);
  });

  let html = `<h2 style="margin-top:0">Lo que hiciste hoy</h2><ul class="ex-list">`;
  Object.keys(grouped).forEach(name => {
    const g = grouped[name];
    const avgWeight = g.weights.filter(w => w > 0).length
      ? (g.weights.reduce((a,b)=>a+b,0) / g.weights.filter(w=>w>0).length).toFixed(1)
      : 0;
    const avgRating = (g.ratings.reduce((a,b)=>a+b,0) / g.ratings.length).toFixed(1);
    const repsDisplay = [...new Set(g.reps)].join(" / ");
    html += `<li><strong>${name}</strong><br><small>${g.sets} series · ${repsDisplay}${avgWeight > 0 ? " · " + avgWeight + " kg" : ""} · dif. prom. ${avgRating}/5</small></li>`;
  });
  html += `</ul><p style="margin-top:16px"><strong>Próxima rutina guardada</strong><br><small>Los pesos y repeticiones se ajustaron según tus calificaciones. La próxima vez que abras la app vas a ver la versión actualizada.</small></p>`;

  document.getElementById("summaryContent").innerHTML = html;

  // Build next routine based on results
  const nextRoutine = JSON.parse(JSON.stringify(ROUTINE));
  nextRoutine.exercises.forEach(ex => {
    const key = state.chosenOption && ex.options && ex.options.includes(state.chosenOption) ? state.chosenOption : ex.name;
    const g = grouped[key] || grouped[ex.name];
    if (!g) return;
    const avgRating = g.ratings.reduce((a,b)=>a+b,0) / g.ratings.length;
    if (ex.weight > 0) {
      if (avgRating <= 2.2) ex.weight = Math.round(ex.weight * 1.05 * 2) / 2;
      else if (avgRating >= 4) ex.weight = Math.max(0, Math.round(ex.weight * 0.92 * 2) / 2);
    }
  });

  localStorage.setItem("nextRoutine", JSON.stringify(nextRoutine));
  localStorage.setItem("lastSession", JSON.stringify({ date: new Date().toISOString(), grouped }));
}

// Load saved next routine if exists
(function loadSaved() {
  const saved = localStorage.getItem("nextRoutine");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.exercises) {
        ROUTINE.exercises = parsed.exercises;
      }
    } catch(e) {}
  }
  initPreview();
})();
</script>
</body>
</html>
